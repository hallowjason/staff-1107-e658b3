<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>瑜珈頌缽細流表</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23E2A33A' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23E2A33A'/%3E%3C/svg%3E">
<style>
  :root {
    --apricot: #F7CD8E; --peach: #F2B49B; --lavender: #B8B4DE; --dusk: #5A5893;
    --ink: #2B2A55; --ink-soft: #4C4B78; --gold: #D8962C; --amber: #9A5B1E;
    --glass-line: rgba(255, 255, 255, .75);
    --todo: #FCE9C6; --line: rgba(90, 88, 147, .16); --line-strong: rgba(90, 88, 147, .38);
    --hl-y: #FFE07A; --hl-g: #BFE6B3; --hl-b: #BCD6F5; --hl-r: #F7B9B2; --hl-p: #DCCBF3;
    --serif: "Noto Serif TC", "Songti TC", "Source Han Serif TC", serif;
    --sans: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html { overflow-x: clip; }
  body {
    margin: 0; color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6;
    background: linear-gradient(180deg, #FBE3C4 0%, #F6CDB4 22%, #E3C7DA 48%, #C5C2E6 72%, #A9AEDD 100%);
    background-attachment: fixed; min-height: 100vh;
  }
  a { color: var(--ink); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .aura { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .aura span { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .6; animation: drift 30s ease-in-out infinite alternate; }
  .aura .a1 { width: 60vmax; height: 60vmax; left: -15vmax; top: -20vmax; background: radial-gradient(circle, #FFD99A, transparent 65%); }
  .aura .a2 { width: 55vmax; height: 55vmax; right: -20vmax; top: 20vh; background: radial-gradient(circle, #F4A9A0, transparent 65%); animation-delay: -8s; }
  .aura .a3 { width: 65vmax; height: 65vmax; left: 10vw; bottom: -30vmax; background: radial-gradient(circle, #9C9FE0, transparent 65%); animation-delay: -14s; }
  @keyframes drift { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(6vw,4vh) scale(1.12); } 100% { transform: translate(-4vw,8vh) scale(.95); } }

  nav { position: sticky; top: 0; z-index: 20; background: rgba(255, 244, 232, .62); backdrop-filter: blur(14px) saturate(1.3); border-bottom: 1px solid var(--glass-line); }
  nav .in { max-width: 1480px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  nav a { flex: none; padding: 12px 12px; font-size: 15px; text-decoration: none; color: var(--ink-soft); white-space: nowrap; border-bottom: 2px solid transparent; }
  nav a:hover { color: var(--gold); }
  nav a[aria-current] { color: var(--ink); border-bottom-color: var(--gold); font-weight: 600; }

  main { max-width: 1480px; margin: 0 auto; padding: 24px 16px 60px; }
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
  .kicker { font-family: var(--serif); color: var(--amber); margin: 0; font-size: 15px; }
  h1 { font-family: var(--serif); font-size: clamp(26px, 3.4vw, 36px); line-height: 1.25; margin: 2px 0 0; letter-spacing: .03em; }
  .status { font-size: 13px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #B5B2CC; flex: none; }
  .status.ok::before { background: #5BA65A; }
  .status.busy::before { background: var(--gold); }
  .status.err::before { background: #D9534A; }

  /* toolbar */
  .bar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px 12px; border-radius: 14px 14px 0 0;
    background: rgba(255, 255, 255, .72); border: 1px solid var(--glass-line); border-bottom: 1px solid var(--line); position: relative; z-index: 6; }
  .btn { height: 34px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line-strong); background: #fff; cursor: pointer; font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { background: #3E3C78; }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.sq { width: 34px; padding: 0; justify-content: center; }
  .tools, .find { display: flex; align-items: center; gap: 8px; }
  .find { flex: 1 1 360px; min-width: 0; }
  .sep { width: 1px; height: 22px; background: var(--line-strong); flex: none; }
  .search { position: relative; flex: 1 1 180px; max-width: 280px; min-width: 0; }
  .search input { width: 100%; height: 34px; padding: 0 30px 0 11px; border-radius: 8px; border: 1px solid var(--line-strong); font: inherit; font-size: 14px; background: #fff; }
  .search button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none; cursor: pointer; color: var(--ink-soft); padding: 2px 6px; display: none; }
  .search.has button { display: block; }
  .who { height: 34px; padding: 0 26px 0 10px; border-radius: 8px; border: 1px solid var(--line-strong); font: inherit; font-size: 14px; background: #fff; cursor: pointer; max-width: 170px; flex: 0 1 auto; min-width: 0; }
  .who.on { background: var(--gold); border-color: var(--gold); color: #fff; }
  .count { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
  .right { display: flex; gap: 8px; margin-left: auto; }

  .fill { display: flex; align-items: center; gap: 5px; }
  .fill .lbl { font-size: 13px; color: var(--ink-soft); margin-right: 2px; }
  .sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line-strong); cursor: pointer; padding: 0; flex: none; background: var(--c); }
  .sw:hover { transform: scale(1.08); }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); transform: scale(1.12); }
  .sw.eraser { background: #fff; display: grid; place-items: center; font-size: 13px; color: var(--ink-soft); }
  .sw.eraser::after { content: ""; width: 16px; height: 2px; background: #D9534A; transform: rotate(-45deg); border-radius: 2px; }

  .more { position: relative; }
  .more summary { list-style: none; }
  .more summary::-webkit-details-marker { display: none; }
  .menu { position: absolute; right: 0; top: calc(100% + 6px); background: #fff; border-radius: 12px; padding: 6px; min-width: 200px;
    box-shadow: 0 18px 40px -12px rgba(43, 42, 85, .35), 0 0 0 1px var(--line); z-index: 30; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14.5px; }
  .menu button:hover { background: #F4F1FA; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }

  .login { position: absolute; right: 12px; top: calc(100% + 6px); background: #fff; border-radius: 14px; padding: 16px; width: min(320px, calc(100vw - 32px));
    box-shadow: 0 18px 40px -12px rgba(43, 42, 85, .35), 0 0 0 1px var(--line); z-index: 30; }
  .login p { margin: 0 0 10px; font-size: 14px; color: var(--ink-soft); }
  .login form { display: flex; gap: 8px; }
  .login input { flex: 1; min-width: 0; height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); font: inherit; font-size: 16px; letter-spacing: .08em; }
  .login .err { color: #B4322A; font-size: 13px; margin: 8px 0 0; min-height: 1em; }

  /* grid */
  .wrap { overflow: auto; max-height: calc(100vh - 200px); min-height: 320px; background: #fff;
    border: 1px solid var(--glass-line); border-top: 0; border-radius: 0 0 14px 14px; box-shadow: 0 20px 50px -30px rgba(60, 50, 120, .45); }
  table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1240px; table-layout: fixed; }
  thead th { position: sticky; top: 0; z-index: 3; background: #EEEAF6; color: var(--ink); font-weight: 600; font-size: 14px; text-align: left;
    padding: 8px 10px; border-bottom: 1px solid var(--line-strong); border-right: 1px solid var(--line); white-space: nowrap; }
  thead th:last-child { border-right: 0; }
  td { vertical-align: top; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; position: relative; }
  td:last-child { border-right: 0; }
  tr.first td { border-top: 2px solid var(--line-strong); }
  tbody tr:first-child td { border-top: 0; }
  td.blk { background: #FBF7F1; }
  tr.core td.blk { background: linear-gradient(100deg, #FFEBC9, #ECE6FA); }

  .c { min-height: 36px; padding: 7px 10px; white-space: pre-wrap; word-break: break-word; outline: none; }
  body.editing .c { cursor: text; }
  body.editing .c:hover { background: rgba(247, 205, 142, .14); }
  .c:focus { background: #FFFCF4; box-shadow: inset 0 0 0 2px var(--gold); }
  body.editing .c:empty::before { content: attr(data-ph); color: #B5B2CC; }
  td.need .c:empty { background: var(--todo); }
  td.need .c:empty::before { content: "待排"; color: #A57A30; }
  .c.time { font-family: var(--serif); font-size: 17px; font-variant-numeric: tabular-nums; color: var(--amber); }
  .c.name { font-weight: 600; font-size: 15.5px; }
  td.bad .c.time { color: #B4322A; box-shadow: inset 3px 0 0 #D9534A; }
  .no { font-family: var(--serif); font-size: 17px; color: var(--dusk); padding: 7px 0 0; text-align: center; font-variant-numeric: tabular-nums; }
  .sn { font-size: 12px; color: #A3A0C2; font-variant-numeric: tabular-nums; padding: 9px 0 0; text-align: center; }

  /* highlight colours — beat block tint, hover and the todo fill */
  td.hl-y { background: var(--hl-y) !important; } td.hl-g { background: var(--hl-g) !important; }
  td.hl-b { background: var(--hl-b) !important; } td.hl-r { background: var(--hl-r) !important; }
  td.hl-p { background: var(--hl-p) !important; }
  td[class*="hl-"] .c, td[class*="hl-"] .c:empty, body.editing td[class*="hl-"] .c:hover { background: transparent; }
  body.painting .c { cursor: cell !important; caret-color: transparent; }
  body.painting td:has(.c):hover { box-shadow: inset 0 0 0 2px var(--ink); }

  .acts { display: none; gap: 2px; padding: 5px 6px; }
  body.editing .acts { display: flex; opacity: .4; transition: opacity .12s; }
  .ib.del { color: #B4322A; }
  body.editing tr:hover .acts.item, body.editing tr:focus-within .acts.item,
  body.editing tbody[data-b]:hover .acts.blk, body.editing tbody[data-b]:focus-within .acts.blk { opacity: 1; }
  .acts.blk { flex-direction: column; align-items: center; padding: 6px 0; }
  .ib { width: 26px; height: 26px; border-radius: 6px; border: 1px solid transparent; background: none; cursor: pointer; font-size: 14px; line-height: 1; color: var(--ink-soft); display: grid; place-items: center; }
  .ib:hover { background: #F1EEF8; border-color: var(--line-strong); color: var(--ink); }
  .ib.del:hover { background: #FBE8E6; border-color: #E2A29C; color: #B4322A; }

  tbody.dim td:not(.blk) { opacity: .28; }
  tbody.dim td.blk { opacity: .45; }
  tr.dim td:not(.blk) { opacity: .28; }
  tr.hit td:not(.blk):not([class*="hl-"]) { background: #FFF6E2; }
  mark { background: #FFD98A; color: inherit; border-radius: 3px; padding: 0 1px; }

  .addrow { display: none; }
  body.editing .addrow { display: table-row-group; }
  .addrow td { border-bottom: 0; }
  .addrow button { margin: 10px; }

  .help { margin: 14px 2px 0; font-size: 13.5px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 18px; }
  kbd { font-family: var(--sans); font-size: 12px; padding: 0 5px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; background: #fff; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 9px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 50; max-width: calc(100vw - 32px); text-align: center; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) { .aura span { animation: none; } }

  /* autocomplete */
  .ac { position: fixed; z-index: 45; background: #fff; border-radius: 10px; padding: 4px; min-width: 210px; max-width: 320px; max-height: 280px; overflow: auto;
    box-shadow: 0 16px 36px -12px rgba(43, 42, 85, .4), 0 0 0 1px var(--line); }
  .ac div { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 14.5px; }
  .ac div.on, .ac div:hover { background: #F4F1FA; }
  .ac small { color: #8E8BB0; font-size: 12.5px; white-space: nowrap; }
  .ac .grp { font-weight: 600; }

  /* roster dialog */
  dialog.roster { border: 0; border-radius: 18px; padding: 0; width: min(760px, calc(100vw - 24px)); max-height: 86vh; color: var(--ink);
    box-shadow: 0 30px 70px -20px rgba(43, 42, 85, .5); }
  dialog.roster::backdrop { background: rgba(43, 42, 85, .35); backdrop-filter: blur(2px); }
  .rh { position: sticky; top: 0; background: #fff; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 12px; z-index: 1; }
  .rh h2 { font-family: var(--serif); font-size: 22px; margin: 0; }
  .rh p { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-soft); }
  .rh .x { margin-left: auto; flex: none; width: 34px; height: 34px; border-radius: 50%; }
  .rb { padding: 6px 20px 20px; }
  .rt { width: 100%; min-width: 0; border-collapse: collapse; table-layout: fixed; }
  .rt thead th { position: static; background: none; border: 0; white-space: normal; }
  .rt td { border-right: 0; }
  .rt th { text-align: left; font-size: 13px; color: var(--ink-soft); font-weight: 500; padding: 8px 6px; }
  .rt td { padding: 4px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
  .rt input { width: 100%; height: 36px; border: 1px solid transparent; border-radius: 7px; padding: 0 8px; font: inherit; font-size: 15px; background: transparent; color: var(--ink); }
  body.editing .rt input { border-color: var(--line); background: #FCFBFE; }
  .rt input:focus { outline: none; border-color: var(--gold); background: #fff; }
  .rt input:disabled { -webkit-text-fill-color: var(--ink); opacity: 1; }
  .rt .del { visibility: hidden; }
  body.editing .rt .del { visibility: visible; }
  .radd { margin-top: 12px; }
  @media (max-width: 600px) {
    .rt thead { display: none; }
    .rt, .rt tbody { display: block; }
    .rt tr { display: grid; grid-template-columns: 1fr 1fr 40px; gap: 4px; padding: 8px 0; border-top: 1px solid var(--line); }
    .rt td { border: 0; padding: 0; }
    .rt td.ral { grid-column: 1 / 3; grid-row: 2; }
    .rt input { height: 40px; }
  }

  /* ---------- phone: card list ---------- */
  @media (max-width: 760px) {
    main { padding: 14px 12px 40px; }
    body.editing main { padding-bottom: 96px; }
    .head { margin-bottom: 10px; }
    .bar { border-radius: 14px; padding: 10px; gap: 8px; }
    .find { flex-basis: 100%; order: 1; }
    .search { max-width: none; flex: 1 1 auto; }
    .who { max-width: 42%; }
    .count { display: none; }
    .right { order: 2; width: 100%; margin: 0; }
    .right > * { flex: 1; }
    .right .btn, .more summary { width: 100%; justify-content: center; height: 38px; }
    .menu { left: 0; right: auto; width: 100%; }
    /* edit tools become a bottom dock within thumb reach */
    .tools { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: rgba(255, 255, 255, .96); backdrop-filter: blur(10px);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px -12px rgba(43, 42, 85, .3);
      overflow-x: auto; scrollbar-width: none; }
    .tools > *, .fill > * { flex-shrink: 0; }
    .fill .lbl { display: none; }
    .tools .btn { height: 40px; }
    .tools .btn.sq { width: 40px; }
    .sw { width: 32px; height: 32px; }
    .tools .addtxt { display: none; }
    .help { display: none; }

    .wrap { max-height: none; overflow: visible; background: none; border: 0; box-shadow: none; min-height: 0; margin-top: 12px; }
    table, colgroup, thead { display: block; min-width: 0; }
    thead, colgroup { display: none; }
    tbody { display: block; }
    tbody[data-b] { background: #fff; border-radius: 14px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 10px 30px -18px rgba(60, 50, 120, .45); }
    tr { display: flex; flex-wrap: wrap; padding: 4px 10px 8px; border-top: 1px solid var(--line); }
    tr.first { padding-top: 0; border-top: 0; }
    td { display: block; border: 0 !important; }
    td.blk { order: -3; background: none; }
    tr.first td.btime { margin: 0 0 4px -10px; }
    tr.first td.bname { margin: 0 -10px 4px 0; }
    td.bno { display: none; }
    td.btime { flex: 0 0 auto; width: auto; padding-left: 10px; background: #F6F1EA; }
    td.btime .c { white-space: nowrap; min-width: 3.2em; }
    td.bname { flex: 1 1 0; padding-right: 10px; background: #F6F1EA; }
    tr.core td.btime, tr.core td.bname { background: #F8E9D2; }
    td.btime .c, td.bname .c { min-height: 0; padding: 10px 6px; }
    td.btime .c { font-size: 19px; }
    td.bname .c { font-size: 17px; font-family: var(--serif); }
    td.snc { display: none; }
    td.f { flex: 1 1 100%; display: flex; align-items: flex-start; border-radius: 6px; }
    td.f::before { content: attr(data-label); flex: 0 0 2.6em; font-size: 12.5px; color: #8E8BB0; padding-top: 7px; }
    td.f[data-f="content"]::before { content: none; }
    td.f[data-f="content"] .c { font-weight: 600; padding-left: 0; }
    td.f .c { flex: 1; min-height: 0; padding: 5px 6px; }
    body:not(.editing) td.f:not(.need):has(.c:empty) { display: none; }
    td.ia { flex: 1 1 100%; }
    body.editing .acts { opacity: 1 !important; }
    .acts.item { justify-content: flex-end; padding: 2px 0 0; }
    .ib { width: 34px; height: 34px; }
    .addrow td { display: block; }
    body.editing .addrow { display: block; }
    .addrow button { margin: 0; width: 100%; height: 44px; justify-content: center; }
  }
  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    nav, .bar, .acts, .addrow, .help, .aura, .status, .toast { display: none !important; }
    body { background: #fff; font-size: 11px; }
    main { padding: 0; max-width: none; }
    .wrap { max-height: none; overflow: visible; box-shadow: none; border: 0; }
    table { min-width: 0; }
    thead th { position: static; }
    .c { min-height: 0; padding: 4px 6px; }
    td.need .c:empty { background: none; }
    td.need .c:empty::before { content: ""; }
    tbody { break-inside: avoid; }
    tbody.dim td, tr.dim td { opacity: 1 !important; }
    td[class*="hl-"] { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>

<nav aria-label="頁面切換"><div class="in">
  <a href="./">工作人員導覽</a>
  <a href="./flow.html" aria-current="page">細流表</a>
  <a href="./signin.html">報到簽到</a>
</div></nav>

<main>
  <div class="head">
    <div>
      <p class="kicker">11/7（六）北一區聯辦｜瑜珈頌缽公益療癒體驗</p>
      <h1>細流表</h1>
    </div>
    <div class="status" id="status" aria-live="polite">讀取中…</div>
  </div>

  <div class="bar" role="toolbar" aria-label="表格工具">
    <div class="tools" id="tools" hidden>
      <button class="btn primary" id="addBlk" type="button" aria-label="新增時段">＋<span class="addtxt"> 新增時段</span></button>
      <button class="btn sq" id="undo" type="button" title="復原（⌘Z）" aria-label="復原" disabled>↶</button>
      <button class="btn sq" id="redo" type="button" title="重做（⌘⇧Z）" aria-label="重做" disabled>↷</button>
      <span class="sep"></span>
      <div class="fill" role="group" aria-label="填色">
        <span class="lbl">填色</span>
        <button class="sw" type="button" data-sw="y" style="--c:var(--hl-y)" aria-label="黃色" aria-pressed="false"></button>
        <button class="sw" type="button" data-sw="g" style="--c:var(--hl-g)" aria-label="綠色" aria-pressed="false"></button>
        <button class="sw" type="button" data-sw="b" style="--c:var(--hl-b)" aria-label="藍色" aria-pressed="false"></button>
        <button class="sw" type="button" data-sw="r" style="--c:var(--hl-r)" aria-label="紅色" aria-pressed="false"></button>
        <button class="sw" type="button" data-sw="p" style="--c:var(--hl-p)" aria-label="紫色" aria-pressed="false"></button>
        <button class="sw eraser" type="button" data-sw="x" aria-label="清除填色" aria-pressed="false"></button>
      </div>
      <span class="sep"></span>
    </div>

    e.preventDefault();

    $('loginErr').textContent = '確認中…';
    try {

    merges.push('A1:H1');
    out.push(`<row r="2" ht="22" customHeight="1">${COLS.map((c, k) => cell(2, k, c, 2)).join('')}</row>`);
    let r = 3;
    state.blocks.forEach((blk, b) => {
      const n = blk.items.length;
      blk.items.forEach((it, i) => {
        const multi = n > 1;
        const head = i === 0 ? [String(b), blk.time, blk.name] : ['', '', ''];
        const hs = [xs(), xs(hlOf(b, -1, 'time')), xs(hlOf(b, -1, 'name'))];
        let row = head.map((v, k) => cell(r, k, v, hs[k])).join('');
        row += FIELDS.map((f, k) => cell(r, k + 3, (multi && f === 'content' && it[f] ? `${i + 1}. ` : '') + (it[f] || ''), xs(hlOf(b, i, f)))).join('');
        out.push(`<row r="${r}">${row}</row>`);
        r++;
      });
      if (n > 1) ['A', 'B', 'C'].forEach(c => merges.push(`${c}${r - n}:${c}${r - 1}`));
    });
    const widths = [6, 9, 14, 36, 22, 12, 20, 30];
    const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>
<sheetViews><sheetView workbookViewId="0"><pane ySplit="2" topLeftCell="A3" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
<cols>${widths.map((w, k) => `<col min="${k + 1}" max="${k + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>
<sheetData>${out.join('')}</sheetData>
<mergeCells count="${merges.length}">${merges.map(m => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>
<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/>
<pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>`;
    const bd = '<border><left style="thin"><color rgb="FFBBBBBB"/></left><right style="thin"><color rgb="FFBBBBBB"/></right><top style="thin"><color rgb="FFBBBBBB"/></top><bottom style="thin"><color rgb="FFBBBBBB"/></bottom><diagonal/></border>';
    const fill = h => `<fill><patternFill patternType="solid"><fgColor rgb="FF${h}"/><bgColor indexed="64"/></patternFill></fill>`;
    const body = f => `<xf numFmtId="0" fontId="0" fillId="${f}" borderId="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>`;
    const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="3"><font><sz val="11"/><name val="Microsoft JhengHei"/></font><font><b/><sz val="14"/><name val="Microsoft JhengHei"/></font><font><b/><sz val="11"/><name val="Microsoft JhengHei"/></font></fonts>
<fills count="8"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>${fill('EEEAF6')}${HL.map(h => fill(HEX[h])).join('')}</fills>
<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>${bd}</borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="9"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment vertical="center"/></xf>
<xf numFmtId="0" fontId="2" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>
${body(0)}${HL.map((h, k) => body(3 + k)).join('')}</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
    const blob = zip([
      ['[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
      ['_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
      ['xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="細流表" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm.Print_Titles" localSheetId="0">細流表!$2:$2</definedName></definedNames></workbook>'],
      ['xl/_rels/workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
      ['xl/styles.xml', styles],
      ['xl/worksheets/sheet1.xml', sheet],
    ]);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '細流表_1107.xlsx'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $('html').addEventListener('click', () => {
    $('more').open = false;
    const doc = document.documentElement.cloneNode(true);
    doc.querySelector('#seed').textContent = JSON.stringify(state);
    doc.querySelectorAll('#grid tbody').forEach(t => t.remove());
    doc.querySelector('#who').innerHTML = '';
    doc.querySelector('body').classList.remove('editing', 'painting');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['<!doctype html>\n' + doc.outerHTML], { type: 'text/html' }));
    a.download = '細流表_1107.html'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  /* ---------- start ---------- */
  render();
  setEditing(false);
  if (API) { status('busy', '連線中…'); pull(); setInterval(poll, 8000); }
  else status('ok', '內容存在這台電腦');
})();
</script>
</body>
</html>
